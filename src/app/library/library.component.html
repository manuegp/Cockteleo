  <!-- Pestañas -->
  <mat-tab-group class="mb-3">
    <mat-tab label="Todas las recetas">
      <!-- Contenido de la primera pestaña -->
      <div class="recetas position-relative">
        <!-- Botón nueva receta -->
        <div class="d-flex justify-content-end mb-3">
          <button class="btn btn-primary nueva-receta" (click)="openNewRecipeDialog()">Nueva receta</button>
        </div>

        <!-- Lista de paneles de expansión -->
        @if (childVisible) {
          @for (recipe of userRecipes?.recipeIdList; track $index) {
        <mat-accordion class="mb-4">
          <mat-expansion-panel class="mb-1">
            <mat-expansion-panel-header>
              <mat-panel-title> {{recipe.name}} </mat-panel-title>
            </mat-expansion-panel-header>
            <app-recipe-info [recipeId]="recipe.recipeId" (recipeDelete)="handleIngredientsChange($event)"></app-recipe-info>
          </mat-expansion-panel>
        </mat-accordion>
      }
        }@else{
        <mat-spinner></mat-spinner>
        }
      </div>
    </mat-tab>

    <!-- <mat-tab label="Favoritos">

  </mat-tab-group>
